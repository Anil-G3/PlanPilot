<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanPilot</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="App">

    <!-- Header -->
    <header>
      <h1 class="title">PlanPilot</h1>
      <p class="tagline">Ideas in. Actions out.</p>
    </header>

    <!-- Add Task Form -->
    <form id="task-form">
      <div id="inp">
        <input type="text" id="task-input" placeholder="Enter your task" autocomplete="off" />
        <button type="submit">Add Task</button>
      </div>
      <div class="btns">
        <select id="priority-select">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
        <select id="category-select">
          <option value="General" selected>General</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
        </select>
      </div>
    </form>

    <!-- Task List -->
    <ul id="task-list"></ul>

    <!-- Progress Tracker -->
    <div class="progress-tracker">
      <p id="progress-text">0 out of 0 tasks Completed</p>
      <div class="progress-bar">
        <div class="progress" id="progress-fill"></div>
      </div>
    </div>

    <button class="clear-btn hidden" id="clear-btn">Clear all Tasks</button>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2026 Anil G &nbsp;&middot;&nbsp; PlanPilot &nbsp;&middot;&nbsp; All rights reserved
    </footer>

  </div>

  <script src="script.js"></script>

</body>

</html>
